; ESP-MeshCore-Gateway
;
; MeshCore liegt unverändert als Git-Submodul unter external/MeshCore (Tag
; repeater-v1.17.1, siehe docs/entscheidungen.md E2). Dessen platformio.ini und
; die Heltec-V4-Varianten werden hier nur eingelesen, um Build-Flags und
; lib_deps wiederzuverwenden. Die Quell-Filter sind eigene, weil src_dir hier
; unser eigenes src/ ist (Upstream-Filter sind relativ zu dessen src/).
;
; Hinweis: Im Projekt-Root darf es KEIN Verzeichnis variants/ und keine
; platformio.local.ini geben - die extra_configs-Globs des Upstream-INIs werden
; relativ zum aktuellen Projekt aufgelöst und würden sie sonst mit einlesen.

[platformio]
default_envs = gateway_heltec_v4
src_dir = src
boards_dir = external/MeshCore/boards
; ed25519 liegt als lokale Lib im Upstream-lib/
lib_dir = external/MeshCore/lib
extra_configs =
  external/MeshCore/platformio.ini
  external/MeshCore/variants/heltec_v4/platformio.ini
  external/MeshCore/variants/heltec_v4_r8/platformio.ini

[gateway_base]
build_flags =
  -I external/MeshCore/src
  -I external/MeshCore/examples/simple_repeater
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"MeshCore GW"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  ; Upstream-"start ota" öffnet einen eigenen SoftAP + Webserver auf Port 80 und
  ; kollidiert mit unserem WLAN/Webserver -> abgeschaltet, eigenes OTA kommt in M5.
  -D DISABLE_WIFI_OTA=1
  ; Upstream-V4 drosselt auf 80 MHz (Akku). Mit WLAN + Webserver volle Leistung.
  -D ESP32_CPU_FREQ=240
  ; Werks-Defaults nach hansemesh.de (EU/UK Narrow, docs/entscheidungen.md E15):
  ; Frequenz/BW/SF kommen schon aus dem Upstream-arduino_base (869.618/62.5/8),
  ; CR fehlt dort und fiele im Repeater auf 5 zurück -> explizit 8.
  -D LORA_CR=8
  ; V4 mit PA: tx 17 = ca. 520 mW am Ausgang (hansemesh-Messung), Upstream 10.
  -D LORA_TX_POWER=17
  -D GATEWAY_VERSION='"0.6.1"'
build_unflags =
  -D ESP32_CPU_FREQ=80
  -D LORA_TX_POWER=10
build_src_filter =
  +<*.cpp>
  +<../external/MeshCore/src/*.cpp>
  +<../external/MeshCore/src/helpers/*.cpp>
  +<../external/MeshCore/src/helpers/radiolib/*.cpp>
  +<../external/MeshCore/src/helpers/bridges/BridgeBase.cpp>
  +<../external/MeshCore/src/helpers/ui/MomentaryButton.cpp>
  +<../external/MeshCore/src/helpers/ui/SSD1306Display.cpp>
  +<../external/MeshCore/src/helpers/sensors>
  +<../external/MeshCore/examples/simple_repeater/MyMesh.cpp>
lib_deps =
  ESP32Async/ESPAsyncWebServer @ 3.10.3
  bakercp/CRC32 @ ^2.0.0
  ; Upstream bekommt die OLED-Libs nur indirekt (nicht in den lib_deps der
  ; V4-Envs gelistet) -> hier explizit, gepinnt auf die Versionen, die der
  ; M0-Upstream-Build aufgelöst hat (docs/entscheidungen.md E8).
  adafruit/Adafruit SSD1306 @ 2.5.17
  adafruit/Adafruit GFX Library @ 1.12.6
  ; M6: Sensormeter-JSON + Regel-Konfig (Version wie im Upstream-Build aufgelöst)
  bblanchon/ArduinoJson @ 7.4.3
extra_scripts = external/MeshCore/merge-bin.py

[env:gateway_heltec_v4]
extends = heltec_v4_oled
build_flags =
  ${heltec_v4_oled.build_flags}
  ${gateway_base.build_flags}
  -I external/MeshCore/variants/heltec_v4
  ; OTA-Merkmal: V4 und V4-R8 haben andere Pins -> nie gegenseitig flashen (E19)
  -D GATEWAY_PROJECT_ID='"MESHCORE-GW-HELTEC-V4"'
build_unflags = ${gateway_base.build_unflags}
build_src_filter =
  ${gateway_base.build_src_filter}
  +<../external/MeshCore/variants/heltec_v4>
lib_deps =
  ${heltec_v4_oled.lib_deps}
  ${gateway_base.lib_deps}
extra_scripts = ${gateway_base.extra_scripts}

[env:gateway_heltec_v4_r8]
extends = heltec_v4_r8_oled
build_flags =
  ${heltec_v4_r8_oled.build_flags}
  ${gateway_base.build_flags}
  -I external/MeshCore/variants/heltec_v4_r8
  -D GATEWAY_PROJECT_ID='"MESHCORE-GW-HELTEC-V4-R8"'
build_unflags = ${gateway_base.build_unflags}
build_src_filter =
  ${gateway_base.build_src_filter}
  +<../external/MeshCore/variants/heltec_v4_r8>
lib_deps =
  ${heltec_v4_r8_oled.lib_deps}
  ${gateway_base.lib_deps}
extra_scripts = ${gateway_base.extra_scripts}
